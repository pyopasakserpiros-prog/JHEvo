<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#10221e" />
    <title>SME Crisis: นิคมอิเล็กทรอนิกส์สยาม — Autonomous Company Sim v0.1.0</title>
    <style>
:root {
  --bg: #102420;
  --panel: #19332d;
  --panel2: #22423a;
  --panel3: #142a25;
  --line: #4f6a5c;
  --ink: #f4efe1;
  --dim: #b8cebe;
  --gold: #eccf82;
  --gold-deep: #cfa84c;
  --cinnabar: #d65a3f;
  --red: #e66052;
  --green: #58d68d;
  --blue: #58b8f6;
  --vio: #b794f4;
  --amber: #f5b041;
  --radius: 14px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Sans Thai", "Sarabun", "Leelawadee UI", system-ui, -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.45;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
}

button {
  font: inherit;
  color: inherit;
  border: 1px solid var(--line);
  background: var(--panel2);
  border-radius: 10px;
  padding: 7px 12px;
  cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
  transition: filter 0.12s ease, border-color 0.12s ease, transform 0.08s ease;
}

button:hover {
  filter: brightness(1.08);
}

button:active {
  filter: brightness(1.2);
  transform: translateY(1px);
}

button[disabled] {
  opacity: 0.48;
  cursor: not-allowed;
  filter: none;
  transform: none;
}

input[type="text"],
input[type="search"],
input[type="number"],
select {
  background: #122822;
  border: 1px solid #557060;
  color: var(--ink);
  border-radius: 10px;
  padding: 7px 10px;
  font: inherit;
  width: 100%;
  user-select: text;
  -webkit-user-select: text;
}

button:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}

#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
}

#map {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
  display: block;
  cursor: grab;
}

#map:active {
  cursor: grabbing;
}

#map { touch-action: none; }

/* ---------- Top HUD (JS2 Style) ---------- */
#hudTop {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  padding: calc(6px + var(--safe-t)) 8px 8px;
  background: linear-gradient(
    180deg,
    rgba(12, 28, 24, 0.94) 0%,
    rgba(16, 36, 32, 0.72) 70%,
    rgba(16, 36, 32, 0) 100%
  );
  pointer-events: none;
  display: flex;
  flex-direction: column;
  gap: 5px;
  z-index: 8;
}

#hudTop > * {
  pointer-events: auto;
}

#dateLine {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
}

#dateTxt {
  white-space: nowrap;
  font-weight: 700;
  font-size: 13.5px;
  line-height: 1.35;
  color: #f8f2e2;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
}

#speedBar {
  display: flex;
  gap: 4px;
}

#speedBar button {
  padding: 4px 10px;
  font-size: 12.5px;
  background: rgba(18, 40, 34, 0.88);
  border: 1px solid #5f7866;
  border-radius: 999px;
  min-width: 38px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

#speedBar button.on {
  background: linear-gradient(180deg, #f3da96, #deb760);
  color: #1c170e;
  border-color: #f7e4ad;
  font-weight: 800;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
}

#resRow {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}

.pill {
  background: rgba(16, 36, 31, 0.88);
  border: 1px solid #5e7665;
  border-radius: 999px;
  padding: 3.5px 10px;
  font-size: 12px;
  line-height: 1.35;
  white-space: nowrap;
  box-shadow: 0 2px 6px rgba(5, 16, 13, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.pill b {
  color: var(--gold);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.pill.warn b {
  color: #ff9c8f;
}

.pill.ok b {
  color: #82f0b1;
}

#tickerRow {
  display: flex;
  align-items: center;
}

.ticker-pill {
  max-width: min(560px, calc(100vw - 116px));
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  padding: 4px 11px;
  border-color: #6b8572;
  background: rgba(20, 44, 38, 0.9);
  color: #e6f0e4;
  text-align: left;
}

.ticker-pill #notice {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---------- Minimap & Floating Camera Buttons ---------- */
#minimap {
  position: absolute;
  right: 8px;
  top: calc(102px + var(--safe-t));
  width: 108px;
  height: 76px;
  border: 2px solid #d8c48b;
  border-radius: 10px;
  background: rgba(8, 20, 16, 0.86);
  opacity: 0.95;
  touch-action: none;
  z-index: 6;
  box-shadow: 0 4px 12px rgba(4, 14, 11, 0.65);
  cursor: pointer;
}

#fabs {
  position: absolute;
  right: 8px;
  bottom: calc(74px + var(--safe-b));
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 7;
}

#fabs button {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  padding: 0;
  font-size: 18px;
  background: linear-gradient(180deg, rgba(36, 68, 59, 0.95), rgba(24, 48, 41, 0.96));
  border: 1px solid #6a8470;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 3px 10px rgba(5, 16, 13, 0.6);
}

#fabs button.on {
  border-color: var(--gold);
  color: var(--gold);
  box-shadow: 0 0 0 2px rgba(236, 207, 130, 0.35), 0 3px 10px rgba(5, 16, 13, 0.6);
}

/* ---------- Selection Banner ---------- */
#selInfo {
  position: absolute;
  left: 8px;
  right: 60px;
  bottom: calc(74px + var(--safe-b));
  max-width: 520px;
  background: linear-gradient(180deg, rgba(33, 63, 54, 0.96), rgba(23, 46, 39, 0.98));
  border: 1px solid #6b8471;
  border-left: 4px solid var(--gold);
  border-radius: 14px;
  padding: 8px 11px;
  display: none;
  gap: 10px;
  align-items: center;
  box-shadow: 0 6px 18px rgba(4, 14, 11, 0.68);
  z-index: 7;
}

#selInfo.show {
  display: flex;
  flex-wrap: wrap;
}

#selInfo .sel-actions { display: flex; gap: 6px; width: 100%; justify-content: flex-end; }
#selInfo .sel-close { flex: 0 0 auto; min-width: 40px; min-height: 40px; }
#selInfo .pt { flex: 0 0 44px; }

/* ---------- Toasts ---------- */
#toasts {
  position: absolute;
  left: 8px;
  right: 124px;
  top: calc(132px + var(--safe-t));
  max-width: 460px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  pointer-events: none;
  z-index: 6;
}

.toast {
  background: rgba(27, 54, 46, 0.96);
  border: 1px solid #637c68;
  border-left: 4px solid var(--gold);
  border-radius: 10px;
  padding: 7px 11px;
  font-size: 12.5px;
  line-height: 1.42;
  pointer-events: auto;
  animation: tin 0.22s ease-out;
  box-shadow: 0 5px 16px rgba(0, 0, 0, 0.55);
}

.toast.err {
  border-left-color: var(--red);
}

@keyframes tin {
  from {
    transform: translateY(-8px);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}

/* ---------- Bottom Navigation Bar (JS2 Style) ---------- */
#hudBottom {
  z-index: 12;
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 6px 4px calc(8px + var(--safe-b));
  display: flex;
  gap: 4px;
  background: linear-gradient(
    0deg,
    rgba(13, 30, 26, 0.95) 0%,
    rgba(16, 36, 32, 0.72) 72%,
    rgba(16, 36, 32, 0) 100%
  );
  justify-content: space-between;
}

#hudBottom button {
  flex: 1 1 0;
  min-width: 48px;
  min-height: 48px;
  background: linear-gradient(180deg, rgba(35, 66, 57, 0.95), rgba(24, 47, 40, 0.96));
  border: 1px solid #597361;
  border-radius: 12px;
  padding: 5px 2px;
  font-size: 11.5px;
  line-height: 1.2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  white-space: nowrap;
  box-shadow: 0 3px 12px rgba(8, 22, 18, 0.45), inset 0 1px 0 rgba(236, 207, 130, 0.12);
}

#hudBottom button span {
  font-size: 17px;
  line-height: 1;
}

#hudBottom button.on {
  border-color: var(--gold);
  color: var(--gold);
  background: linear-gradient(180deg, #325a49, #223f33);
  font-weight: 700;
}

/* ---------- Slide-Up Sheet / Drawer (JS2 Style) ---------- */
#sheet {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 75%;
  background: linear-gradient(180deg, #1f3c34 0%, #172e28 100%);
  border-radius: 18px 18px 0 0;
  border-top: 2px solid #cbb67e;
  box-shadow: 0 -10px 32px rgba(4, 14, 11, 0.72);
  display: none;
  flex-direction: column;
  z-index: 10;
  padding-bottom: calc(64px + var(--safe-b));
}

#sheet.show {
  display: flex;
  animation: sup 0.2s ease-out;
}

#sheet.tall {
  height: 90%;
}

@keyframes sup {
  from {
    transform: translateY(32px);
    opacity: 0.45;
  }
  to {
    transform: none;
    opacity: 1;
  }
}

#shHead {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px 8px;
  border-bottom: 1px solid #466050;
  background: rgba(20, 42, 36, 0.55);
}

#shTitle {
  flex: 1;
  font-weight: 700;
  font-size: 15.5px;
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #f8f2e2;
}

.sh-actions {
  display: flex;
  gap: 5px;
}

.sh-actions button {
  padding: 5px 10px;
  font-size: 13px;
  border-radius: 9px;
}

#shTabs {
  display: flex;
  gap: 5px;
  padding: 7px 10px;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid #466050;
  background: rgba(18, 37, 32, 0.42);
}

#shTabs::-webkit-scrollbar {
  display: none;
}

#shTabs button {
  flex: 0 0 auto;
  padding: 5.5px 12px;
  font-size: 12.5px;
  line-height: 1.3;
  background: #18312a;
  border: 1px solid #526a59;
  border-radius: 999px;
  color: var(--dim);
}

#shTabs button.on {
  background: linear-gradient(180deg, #f2d894, #dfb862);
  color: #1d1810;
  border-color: #f5e1a4;
  font-weight: 700;
}

#shBody {
  flex: 1;
  overflow-y: auto;
  padding: 10px 12px 22px;
  -webkit-overflow-scrolling: touch;
  user-select: text;
  -webkit-user-select: text;
}

/* ---------- Cards, Bars, Chips & Tables (JS2 Style) ---------- */
h3 {
  margin: 13px 0 6px;
  font-size: 13.5px;
  line-height: 1.35;
  color: var(--gold);
  letter-spacing: 0.2px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

h3:first-child {
  margin-top: 2px;
}

.card {
  background: linear-gradient(180deg, #25453b, #1f3b33);
  border: 1px solid #526a59;
  border-radius: var(--radius);
  padding: 10px 12px;
  margin-bottom: 8px;
  box-shadow: 0 2px 6px rgba(6, 18, 14, 0.28), inset 0 1px 0 rgba(244, 230, 190, 0.07);
}

.muted {
  color: var(--dim);
  font-size: 12px;
  line-height: 1.45;
}

.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 10px;
}

.grid3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

/* Progress bars with optional white marker line (JS2 Style 233242/233243) */
.bar {
  display: grid;
  grid-template-columns: 128px 1fr minmax(36px, auto);
  gap: 8px;
  align-items: center;
  margin: 4.5px 0;
  font-size: 12.5px;
}

.bar .lb {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #e6efe0;
}

.bar .tr {
  height: 8.5px;
  background: #122721;
  border: 1px solid #354f41;
  border-radius: 999px;
  position: relative;
  overflow: hidden;
}

.bar .fl {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  border-radius: 999px;
}

.bar .mk {
  position: absolute;
  top: -1px;
  bottom: -1px;
  width: 2.5px;
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 0 3px rgba(0, 0, 0, 0.8);
}

.bar .vl {
  text-align: right;
  color: var(--dim);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}

/* Skill row with descriptive caption (JS2 Style 233239) */
.skill-item {
  padding: 7px 0;
  border-bottom: 1px solid rgba(79, 106, 92, 0.45);
}

.skill-item:last-child {
  border-bottom: 0;
}

.skill-sub {
  font-size: 11.5px;
  color: var(--dim);
  margin-top: 2px;
  line-height: 1.4;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2.5px 8.5px;
  margin: 2px 3px 2px 0;
  border-radius: 999px;
  background: #152c26;
  border: 1px solid #556d5c;
  font-size: 11.5px;
  line-height: 1.35;
}

.chip.g {
  border-color: var(--gold);
  color: var(--gold);
  background: rgba(45, 39, 22, 0.65);
}

.chip.r {
  border-color: var(--red);
  color: #ffaba0;
  background: rgba(56, 24, 22, 0.65);
}

.chip.b {
  border-color: var(--blue);
  color: #a8dfff;
  background: rgba(20, 43, 58, 0.65);
}

.chip.v {
  border-color: var(--vio);
  color: #dec8ff;
  background: rgba(40, 29, 58, 0.65);
}

.chip.ok {
  border-color: var(--green);
  color: #a6f2c4;
  background: rgba(20, 52, 36, 0.65);
}

/* Person / Building Row Cards */
.prow {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 11px;
  border-radius: 12px;
  background: linear-gradient(180deg, #26473d, #1f3b32);
  border: 1px solid #536b5a;
  margin-bottom: 6px;
  cursor: pointer;
  transition: border-color 0.12s ease, filter 0.12s ease;
}

.prow:hover {
  border-color: var(--gold);
}

.prow:active {
  filter: brightness(1.15);
}

.prow .pi {
  flex: 1;
  min-width: 0;
}

.prow .nm {
  font-weight: 700;
  font-size: 13.5px;
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
  gap: 6px;
}

.prow .sub {
  font-size: 11.5px;
  line-height: 1.4;
  color: var(--dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mini-bars {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
  margin-top: 5px;
}

.mini {
  height: 5px;
  background: #122620;
  border-radius: 3px;
  overflow: hidden;
}

.mini i {
  display: block;
  height: 100%;
}

/* Log rows (JS2 Style 233241) */
.logrow {
  padding: 7px 4px;
  border-bottom: 1px solid #365042;
  font-size: 12.5px;
  line-height: 1.5;
}

.logrow:last-child {
  border-bottom: 0;
}

.logrow .tm {
  color: var(--gold);
  font-size: 11px;
  font-weight: 600;
  margin-right: 6px;
  font-variant-numeric: tabular-nums;
}

.logrow .actor {
  color: #7ad0ff;
  font-weight: 600;
}

/* Inventory & Item Icon Grid (JS2 Style 233244) */
.inv-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(74px, 1fr));
  gap: 6px;
  margin-top: 6px;
}

.inv-cell {
  position: relative;
  aspect-ratio: 1 / 1;
  min-height: 68px;
  background: radial-gradient(circle at 50% 35%, #26483e, #152923 85%);
  border: 1.5px solid #556e5c;
  border-radius: 11px;
  padding: 6px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  cursor: pointer;
  overflow: hidden;
}

.inv-cell.sel {
  border-color: var(--gold);
  box-shadow: 0 0 0 2px rgba(236, 207, 130, 0.35), inset 0 0 10px rgba(236, 207, 130, 0.2);
}

.inv-cell .ic {
  font-size: 24px;
  line-height: 1;
}

.inv-cell .nm {
  font-size: 10.5px;
  color: #e8f0e4;
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.inv-b-tl {
  position: absolute;
  top: 3px;
  left: 4px;
  font-size: 9px;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 4px;
  background: rgba(12, 26, 22, 0.86);
  color: #cfe3d5;
  border: 1px solid #496353;
}

.inv-b-tr {
  position: absolute;
  top: 3px;
  right: 4px;
  font-size: 9px;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 4px;
  background: rgba(31, 64, 50, 0.9);
  color: #84f5b2;
  border: 1px solid #459366;
}

.inv-b-br {
  position: absolute;
  bottom: 3px;
  right: 4px;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 4.5px;
  border-radius: 4px;
  background: rgba(10, 22, 18, 0.9);
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  margin: 3px 4px 3px 0;
  border: 1px solid #597260;
}

.btn.pri {
  background: linear-gradient(180deg, #f2d995, #dfb862);
  color: #1d1810;
  border-color: #f6e3a8;
  font-weight: 700;
}

.btn.dan {
  background: #6e2c27;
  border-color: #a04942;
  color: #ffdfdc;
}

.sw {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 2px;
  border-bottom: 1px solid #365042;
  gap: 10px;
}

.sw:last-child {
  border-bottom: 0;
}

.sw input[type="checkbox"] {
  width: 20px;
  height: 20px;
  accent-color: var(--gold);
}

canvas.pt {
  border: 1.5px solid #758e79;
  border-radius: 12px;
  box-shadow: 0 2px 6px rgba(6, 18, 14, 0.45);
  background: #152b25;
  flex: 0 0 auto;
}

/* Hidden compatibility container for automated test scripts */
.sr-compat {
  position: fixed;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
  pointer-events: none;
}

/* Responsive Desktop Layout */
@media (min-width: 720px) {
  #sheet {
    left: auto;
    width: 490px;
    right: 12px;
    bottom: 72px;
    height: calc(100vh - 180px);
    max-height: 760px;
    border-radius: 18px;
    border: 1px solid #6b826f;
    border-top: 2px solid #cbb67e;
    padding-bottom: 0;
  }
  #sheet.tall {
    width: min(680px, calc(100vw - 28px));
    height: calc(100vh - 140px);
  }
  #hudBottom {
    max-width: 600px;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 16px 16px 0 0;
  }
}

/* Responsive Phone Layout */
@media (max-width: 719px) {
  #dateLine {
    flex-direction: column;
    align-items: stretch;
    gap: 4px;
  }

    function pay(w, isScheduledPayday = false) {

        const p = people[index],
          due = p.pay.dueBase + p.pay.dueOT,
          wasOverdue = p.pay.overdueSince !== null,
          amount = Math.min(
            due,
            index === people.length - 1
              ? left

          base = Math.min(p.pay.dueBase, amount),
          ot = amount - base;

        if (ot) post(w, "overtime", -ot, p.id);

        p.pay.dueOT -= ot;
        p.pay.wallet += amount;
        p.pay.totalPaid += amount;

        if (p.pay.dueBase + p.pay.dueOT === 0) p.pay.overdueSince = null;

            : code === "orderShipped"
              ? "ส่งมอบสินค้าครบตามจำนวน ฝ่ายบัญชีออกใบแจ้งหนี้ (Invoice) รอรับชำระส่วนที่เหลือ"
              : "เงินสดจากลูกค้าโอนเข้าบัญชีบริษัท ช่วยยืด Runway และสภาพคล่อง";
      } else if (["purchaseOrdered", "materialsReceived"].includes(code)) {
        category = "SUPPLY";
        categoryLabelTh = "คลัง/จัดซื้อ";
        meaningTh =
          code === "purchaseOrdered"
            ? "ตัดเงินสดซื้อวัตถุดิบและรอฝ่ายธุรการออกใบ PO ก่อนเริ่มนับเวลาขนส่ง (Lead Time)"
            : "รถบรรทุกส่งวัตถุดิบเข้าคลังเรียบร้อย ช่างประกอบสามารถเบิกไปผลิตต่อได้ทันที";
      } else if (["reworkNeeded", "unitScrapped"].includes(code)) {
        category = "PROD";
        categoryLabelTh = "โรงงาน/QC";
        epistemicStatus = "OBSERVED";
        epistemicBadgeTh = "👁️ รายงานหน้างาน";
        isMajor = code === "unitScrapped";
        meaningTh =
          code === "reworkNeeded"
            ? "ผู้ตรวจ QC พบจุดบกพร่องจากความล้า/ความเครียด ส่งกลับให้ช่างซ่อมแซม (ใช้เวลา 40%)"
            : "ชิ้นงานซ่อมไม่ผ่านเกินโควตา ต้องตัดเป็นของเสียและเสียต้นทุนวัตถุดิบไป";
      } else if (code === "productUnlocked") {
        category = "RND";
        categoryLabelTh = "วิจัย R&D";
        isMajor = true;
        meaningTh =
          "วิศวกรสะสมแต้มวิจัยครบเกณฑ์ ปลดล็อกสินค้าใหม่ที่มีอัตรากำไรต่อชิ้นสูงขึ้น";
      } else if (["employeeConcern", "employeeLeft", "overtimeResponse", "employeeHired"].includes(code)) {
        category = "HR_CULTURE";
        categoryLabelTh = "บุคลากร/ชีวิต";
        isMajor = code === "employeeLeft" || code === "employeeHired";
        if (code === "employeeConcern" || code === "overtimeResponse") {
          epistemicStatus = code === "employeeConcern" ? "RUMOR" : "OBSERVED";
          epistemicBadgeTh =
            code === "employeeConcern" ? "☕ เสียงสะท้อนพนักงาน" : "👁️ บันทึกกะทำงาน";
        }
        meaningTh =
          code === "employeeConcern"
            ? "พนักงานเริ่มสะสมความเครียดหรือกังวลเรื่องค่าตอบแทน หากปล่อยไว้นานอาจตัดสินใจลาออก"
            : code === "employeeLeft"
              ? "พนักงานลาออกจากบริษัท ทำให้กำลังการผลิตลดลง"
              : code === "employeeHired"
                ? "ฝ่ายบุคคลรับพนักงานใหม่เข้าสู่ทีมเพื่อรองรับปริมาณงาน"
                : "การตัดสินใจทำ OT มาจากพลังงาน ภาระทางบ้าน และค่านิยมของพนักงานแต่ละคน";
      }

      const actorObj =
        (e.details?.personId && w.people.find((p) => p.id === e.details.personId)) ||
        w.people.find((p) => e.message && e.message.includes(p.name)) ||
        null;
      const actorId = actorObj ? actorObj.id : null;
      const actorName = actorObj ? actorObj.name : null;
      const storyThreadId =
        e.details?.orderId || e.details?.purchaseId || actorId || null;

      return {
        ...e,
        day: d,
        minuteOfDay,
        epistemic: epistemicStatus,
        epistemicStatus,
        epistemicLabelTh: epistemicBadgeTh,
        epistemicBadgeTh,
        category,
        categoryLabelTh,
        major: isMajor,
        isMajor,
        actorId,
        actorName,
        storyThreadId,
        meaningTh,
      };
    }

    // JS2-inspired Periodic Company Digest (1 / 7 / 30 days separated into 4 clean accounts)
    function computePeriodDigest(w, periodDays, burn) {
      const cutoff = Math.max(0, w.clock.absoluteMinute - periodDays * 1440);
      const entries = w.finance.entries.filter((e) => e.at >= cutoff);
      const sumKind = (k) =>
        entries.filter((e) => e.kind === k).reduce((s, e) => s + e.delta, 0);

      const salesIn = sumKind("sales");
      const materialsOut = Math.abs(sumKind("materials"));
      const wagesOut = Math.abs(sumKind("wages") + sumKind("overtime") + sumKind("welfare"));
      const fixedOut = Math.abs(sumKind("rent") + sumKind("interest"));
      const netOperating = salesIn - materialsOut - wagesOut - fixedOut;

      const recentTasks = w.history.tasks.filter((t) => t.at >= cutoff);
      const recentEvents = w.events.filter((e) => e.at >= cutoff);
      const employed = w.people.filter((p) => p.employed);
      const avgEnergy = employed.length
        ? Math.round(employed.reduce((s, p) => s + p.state.energy, 0) / employed.length)
        : 0;
      const avgMorale = employed.length
        ? Math.round(employed.reduce((s, p) => s + p.state.morale, 0) / employed.length)
        : 0;
      const avgStress = employed.length
        ? Math.round(employed.reduce((s, p) => s + p.state.stress, 0) / employed.length)
        : 0;

      const totalRawUnits = Object.values(w.inventory.materials || {}).reduce((a, n) => a + n, 0);
      const totalFinishedUnits = Object.values(w.inventory.finished || {}).reduce((a, n) => a + n, 0);

      return {
        days: periodDays,
        periodDays,
        labelTh: `รอบ ${periodDays} วันล่าสุด`,
        cashflow: {
          revenue: salesIn,
          materials: materialsOut,
          payrollAndWelfare: wagesOut,
          overhead: fixedOut,
          netOperating,
          endingCash: w.finance.cash,
          endingDebt: w.finance.debt,
        },
        operations: {
          dealsAccepted: recentEvents.filter((e) => e.code === "orderAccepted").length,
          ordersDelivered: recentEvents.filter((e) => e.code === "orderShipped").length,
          qcPassed: recentTasks.filter((t) => t.kind === "qa").length,
          qcRework: recentEvents.filter((e) => e.code === "reworkNeeded").length,
          activeJobs: Object.keys(w.jobs).length,
        },
        inventory: {
          poIssued: recentEvents.filter((e) => e.code === "purchaseOrdered").length,
          deliveriesReceived: recentEvents.filter((e) => e.code === "materialsReceived").length,
          totalRawUnits,
          totalFinishedUnits,
        },
        people: {
          headcount: employed.length,
          hiresInPeriod: recentEvents.filter((e) => e.code === "employeeHired").length,
          avgStress,
          avgMorale,
          avgEnergy,
          researchPoints: Math.round(w.research.points),
        },
        account1_position: {
          cash: w.finance.cash,
          debt: w.finance.debt,
          runwayDays: burn ? Math.floor((w.finance.cash / burn) * 10) / 10 : null,
          reputation: w.reputation,
        },
        account2_cashflow: {
          salesIn,
          materialsOut,
          wagesOut,
          fixedOut,
          netOperating,
        },
        account3_production: {
          tasksCompleted: recentTasks.length,
          assemblyCount: recentTasks.filter((t) => t.kind === "assembly").length,
          qaCount: recentTasks.filter((t) => t.kind === "qa").length,
          shippedOrders: recentTasks.filter((t) => t.kind === "shipping").length,
          totalShippedUnits: Object.values(w.production.shipped || {}).reduce((a, n) => a + n, 0),
          totalScrappedUnits: Object.values(w.production.scrapped || {}).reduce((a, n) => a + n, 0),
        },
        account4_people: {
          employedCount: employed.length,
          avgEnergy,
          avgMorale,
          avgStress,
          concernCount: employed.filter((p) => p.concern).length,
        },
      };
    }

    function compareEmployees(personA, personB) {
      if (!personA || !personB) return null;
      const inter = H.evaluateInteraction(
        personA.profile,
        personA.state,
        personB.profile,
        personB.state,
        {
          mode: "help",
          existingTrust: personA.relationships?.[personB.id]?.trust || 0,
        },
      );
      const skillSpecs = D && D.SKILLS ? D.SKILLS : Object.values(D.createCatalog().skills);
      const skills = skillSpecs.map((s) => {
        const a = Math.round(personA.skills?.[s.id]?.level || 0);
        const b = Math.round(personB.skills?.[s.id]?.level || 0);
        return { id: s.id, nameTh: s.nameTh, a, b, delta: a - b };
      });
      const vitalDefs = [
        ["energy", "พลังงานกาย"],
        ["focus", "สมาธิจดจ่อ"],
        ["morale", "ขวัญกำลังใจ"],
        ["stress", "ความเครียด"],
        ["burnout", "ภาวะหมดไฟ"],
        ["fulfillment", "ความอิ่มเอมใจ"],
      ];
      const vitality = vitalDefs.map(([k, nameTh]) => {
        const a = Math.round(personA.state?.[k] || 0);
        const b = Math.round(personB.state?.[k] || 0);
        return { id: k, nameTh, a, b, delta: a - b };
      });
      const personality = H.PERSONALITY.map((k) => {
        const a = Math.round(personA.profile?.personality?.[k] || 0);
        const b = Math.round(personB.profile?.personality?.[k] || 0);
        return { id: k, nameTh: labels[k] || k, a, b, delta: a - b };
      });
      const values = H.VALUES.map((k) => {
        const a = Math.round(personA.profile?.values?.[k] || 0);
        const b = Math.round(personB.profile?.values?.[k] || 0);
        return { id: k, nameTh: labels[k] || k, a, b, delta: a - b };
      });
      const aptitudes = H.APTITUDES.map((k) => {
        const a = Math.round(personA.profile?.aptitudes?.[k] || 0);
        const b = Math.round(personB.profile?.aptitudes?.[k] || 0);
        return { id: k, nameTh: labels[k] || k, a, b, delta: a - b };
      });
      return {
        compatibility: inter.compatibility,
        collaborationMultiplier: inter.collaborationMultiplier,
        trustAB: personA.relationships?.[personB.id]?.trust || 0,
        familiarityAB: personA.relationships?.[personB.id]?.familiarity || 0,
        skills,
        vitality,
        personality,
        values,
        aptitudes,
      };
    }

    function view(w) {
      const day = Math.floor(w.clock.absoluteMinute / 1440) + 1,
        minute = w.clock.absoluteMinute % 1440,
        employed = w.people.filter((p) => p.employed),
        burn =
          w.catalog.rules.rentDaily +
          Math.round(w.finance.debt * w.catalog.rules.interestDaily) +
          employed.reduce((n, p) => n + p.pay.dailyWage, 0) +
          w.policies.wellbeingDaily * employed.length;
      const people = w.people.map((p) => {
        const unpaidDays =
            p.pay.overdueSince === null
              ? 0
              : Math.max(1, day - p.pay.overdueSince),
          affect = H.deriveAffect(p.profile, p.state, { unpaidDays }),
          aspirations = H.deriveAspirations(p.profile, p.state, {
            wallet: p.pay.wallet,
            goalSpecs: w.catalog.lifeGoals,
          }),
          buildingId = resolvePersonBuildingId(w, p),
          buildingSpec = CAMPUS_BUILDINGS.find((b) => b.id === buildingId),
          isIndoors = Boolean(
            p.employed &&
              p.atWork &&
              p.path.length === 0 &&
              buildingSpec &&
              buildingSpec.indoor,
          ),
          recentThoughts = buildThoughts(w, p, affect, aspirations);
        return {
          id: p.id,
          name: p.name,
          role: p.role,
          roleName: w.catalog.roles[p.role].nameTh,
          employed: p.employed,
          atWork: p.atWork,
          profile: p.profile,
          state: p.state,
          affect,
          aspirations,
          skills: p.skills,
          experience: p.experience,
          relationships: p.relationships,
          concern: p.concern,
          pay: p.pay,
          activity: p.activity,
          activityLabelTh: resolveActivityLabelTh(p),
          emoji: resolveActivityEmoji(p),
          thoughtTh: recentThoughts[0] || "",
          recentThoughts,
          intent: p.intent,
          decision: p.decision || null,
          ot: p.ot,
          taskId: p.taskId,
          stationId: p.stationId,
          buildingId,
          isIndoors,
          position: p.position,
          previousPosition: p.previousPosition,
          path: p.path,
          zoneId: L.zoneAt(w.layout, p.position),
          visible: p.employed && p.atWork,
          visual: p.visual,
        };
      });
      const jobs = Object.values(w.jobs).map((j) => {
        let blockedReason = null;
        if (!j.assignee) {
          const u = w.units[j.unitId];
          if (
            u &&
            !u.materialConsumed &&
            !u.reserved &&
            Object.entries(w.catalog.products[u.productId].bom).some(
              ([m, n]) =>
                w.inventory.materials[m] - w.inventory.reserved[m] < n,
            )
          )
            blockedReason = "materials";
          else if (
            !Object.values(w.layout.stations).some(
              (s) =>
                s.kind === j.stationKind &&
                w.people.filter(
                  (p) => p.employed && p.taskId && p.stationId === s.id,
                ).length < s.capacity,
            )
          )
            blockedReason = "stationCapacity";
        }
        return { ...j, fraction: j.progress / j.required, blockedReason };
      });
      const units = Object.values(w.units).map((u) => {
        const job = Object.values(w.jobs).find((j) => j.unitId === u.id),
          person = job && w.people.find((p) => p.id === job.assignee);
        return {
          ...u,
          stationId: person?.stationId || null,
          storageStationId:
            u.stage === "ready"
              ? "finished"
              : !u.materialConsumed
                ? "stock"
                : null,
        };
      });
      const buildings = CAMPUS_BUILDINGS.map((b) => {
        const occupants = people.filter(
          (p) => p.employed && p.atWork && p.buildingId === b.id,
        );
        const indoorWorkers = occupants.filter((p) => p.isIndoors);
        const activeJobs = jobs.filter(
          (j) =>
            b.stationKinds.includes(j.stationKind) ||
            occupants.some((p) => p.taskId === j.id),
        );
        return {
          ...b,
          level: w.facilities?.levels?.[b.id] || 1,
          occupantIds: occupants.map((p) => p.id),
          indoorCount: indoorWorkers.length,
          totalAssignedCount: occupants.length,
          activeJobCount: activeJobs.length,
          lightsOn:
            occupants.length > 0 &&
            (minute >= 1020 || minute < 390 || activeJobs.some((j) => j.assignee)),
        };
      });
      const rawEvents = [...w.events].slice(-45).reverse();
      const chronicle = rawEvents.map((e) => presentChronicleEntry(w, e));
      const digests = {
        d1: computePeriodDigest(w, 1, burn),
        d7: computePeriodDigest(w, 7, burn),
        d30: computePeriodDigest(w, 30, burn),
      };
      return freeze(
        clone({
          apiVersion: "1.0.0",
          gameVersion: S.VERSION,
          core: {
            version: H.VERSION,
            status: "locked",
            personalityDimensions: H.PERSONALITY.length,
            valueDimensions: H.VALUES.length,
            aptitudeDimensions: H.APTITUDES.length,
          },
          time: {
            absoluteMinute: w.clock.absoluteMinute,
            day,
            minute,
            tick: w.clock.tick,
            hour: Math.floor(minute / 60),
            minuteOfHour: minute % 60,
          },
          seed: w.seed,
          status: w.status,
          outcome: w.outcome,
          company: {
            cash: w.finance.cash,
            debt: w.finance.debt,
            reputation: w.reputation,
            dailyBurnEstimate: burn,
            runwayDays: burn
              ? Math.floor((w.finance.cash / burn) * 10) / 10
              : null,
            runwayNote: "ค่าใช้จ่ายเฉลี่ย ไม่ใช่วันล้มละลายแน่นอน",
            unpaidWages: w.people.reduce(
              (n, p) => n + p.pay.dueBase + p.pay.dueOT,
              0,
            ),
            overdueBills: w.finance.payables,
            receivable: Object.values(w.invoices)
              .filter((i) => i.status === "unpaid")
              .reduce((n, i) => n + i.amount, 0),
            totals: w.finance.totals,
            metrics: w.metrics,
          },
          policies: w.policies,
          people,
          offers: Object.values(w.offers).filter((o) => o.status === "open"),
          orders: Object.values(w.orders),
          jobs,
          purchases: Object.values(w.purchases),
          invoices: Object.values(w.invoices),
          inventory: w.inventory,
          research: {
            ...w.research,
            unlockedProducts: w.research.unlocked,
          },
          production: w.production,
          catalog: {
            rules: w.catalog.rules,
            materials: Object.values(w.catalog.materials),
            products: Object.values(w.catalog.products).map((p) => ({
              ...p,
              bomCost: Object.entries(p.bom).reduce(
                (n, [m, q]) => n + w.catalog.materials[m].unitCost * q,
                0,
              ),
              unlocked: w.research.unlocked.includes(p.id),
            })),
            skills: Object.values(w.catalog.skills),
            roles: Object.entries(w.catalog.roles).map(([id, r]) => ({
              id,
              ...r,
            })),
            taskKinds: Object.values(w.catalog.taskKinds || {}),
            dimensions: {
              personality: H.PERSONALITY.map((id) => ({
                id,
                nameTh: labels[id],
              })),
              values: H.VALUES.map((id) => ({ id, nameTh: labels[id] })),
              aptitudes: H.APTITUDES.map((id) => ({ id, nameTh: labels[id] })),
            },
          },
          candidates: S.candidates(w),
          campus: {
            buildings,
            facilityDecision: w.facilities?.lastDecision || null,
            trainingMinutes: w.facilities?.trainingMinutes || 0,
          },
          scene: {
            coordinateSystem: "tile-x-right-y-down",
            tileSize: 1,
            layout: w.layout,
            buildings,
            units,
            people: people.map((p) => ({
              id: p.id,
              name: p.name,
              role: p.role,
              roleName: p.roleName,
              position: p.position,
              previousPosition: p.previousPosition,
              path: p.path,
              activity: p.activity,
              activityLabelTh: p.activityLabelTh,
              emoji: p.emoji,
              stationId: p.stationId,
              buildingId: p.buildingId,
              isIndoors: p.isIndoors,
              visible: p.visible,
              visual: p.visual,
            })),
          },
          events: w.events.slice(-30),
          chronicle,
          digests,
          ledger: w.finance.entries.slice(-30),
          dailyHistory: w.history.days.slice(-30),
          taskHistory: w.history.tasks.slice(-30),
        }),
      );
    }
    function create(seed = "company", options = {}) {
      let world = S.create(seed, options),
        speed = 0,
        lastFrame = null,
        accumulator = 0,
        lastError = null;
      const listeners = new Set();
      const snapshot = () => view(world);
      const publish = () => {
        if (!listeners.size) return;
        const data = snapshot();
        for (const fn of listeners)
          try {
            fn(data);
          } catch (e) {
            lastError = e.message || String(e);
          }
      };
      const api = {
        snapshot,
        dispatch(command) {
          const result = S.command(world, command);
          if (result.ok) publish();
          return result;
        },
        advance(minutes) {
          const result = S.advance(world, minutes);
          publish();
          return result;
        },
        save() {
          return Save.serialize(world);
        },
        load(text) {
          let next;
          try {
            next = Save.deserialize(text);
          } catch (e) {
            return { ok: false, code: "invalidSave", message: e.message };
          }
          world = next;
          lastFrame = null;
          accumulator = 0;
          publish();
          return { ok: true };
        },
        newGame(nextSeed, nextOptions = options) {
          const next = S.create(nextSeed, nextOptions);
          world = next;
          speed = 0;
          lastFrame = null;
          accumulator = 0;
          publish();
          return snapshot();
        },
        subscribe(fn) {
          if (typeof fn !== "function")
            throw new TypeError("listener must be a function");
          listeners.add(fn);
          try {
            fn(snapshot());
          } catch (e) {
            lastError = e.message || String(e);
          }
          return () => listeners.delete(fn);
        },
        setSpeed(value) {
          if (![0, 1, 2, 5, 10, 20].includes(value))
            throw new TypeError("unsupported speed");
          speed = value;
          lastFrame = null;
          accumulator = 0;
        },
        getSpeed() {
          return speed;
        },
        resetClock() {
          lastFrame = null;
          accumulator = 0;
        },
        frame(timestamp) {
          if (typeof timestamp !== "number" || !Number.isFinite(timestamp))
            throw new TypeError("invalid frame time");
          const dt = lastFrame === null ? 0 : timestamp - lastFrame;
          lastFrame = timestamp;
          if (dt < 0 || dt > 1000 || speed === 0 || world.status !== "running")
            return 0;
          accumulator += (dt / 1000) * 10 * speed;
          const minutes = Math.floor(accumulator / S.TICK) * S.TICK;
          if (minutes) {
            accumulator -= minutes;
            const result = S.advance(world, minutes);
            publish();
            return result;
          }
          return 0;
        },
        lastPresentationError() {
          return lastError;
        },
        audit() {
          return Save.validate(world);
        },
      };
      return Object.freeze(api);
    }
    return Object.freeze({
      VERSION: "1.0.0",
      CAMPUS_BUILDINGS,
      compareEmployees,
      create,
    });
  },
);
